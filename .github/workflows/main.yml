name: Domain Auto Renewal

on:
  schedule:
    - cron: '0 21 * * *' # 每天 UTC 时间 21 点运行
  workflow_dispatch: # 手动触发

jobs:
  check-and-renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv requests pytz

      - name: Check and renew domains
        id: check-and-renew
        env:
          DOMAIN_NAMES: ${{ secrets.DOMAIN_NAMES }}
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python scripts/renew_domain.py

      # Email sending is now handled within renew_domain.py
      # This step is no longer needed
