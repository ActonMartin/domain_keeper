# 这些是支持的赞助平台配置
# 取消注释你想要启用的平台

# GitHub Sponsors
# github: # 替换为你的 GitHub 用户名，例如: github: ActonMartin

# Patreon
# patreon: # 替换为你的 Patreon 用户名

# Open Collective
# open_collective: # 替换为你的 Open Collective 项目名

# Ko-fi
# ko_fi: # 替换为你的 Ko-fi 用户名

# Tidelift
# tidelift: # 替换为你的包管理器和包名，例如: tidelift: npm/express

# Community Bridge
# community_bridge: # 替换为你的项目名

# Liberapay
# liberapay: # 替换为你的 Liberapay 用户名

# Issuehunt
# issuehunt: # 替换为你的 Issuehunt 用户名

# Otechie
# otechie: # 替换为你的 Otechie 用户名

# 自定义赞助链接（可以指向收款码页面）
custom: ['https://github.com/ActonMartin/domain_keeper/blob/master/DONATE.md']

# 注意：
# 1. 如果你有收款码图片，可以创建 DONATE.md 文件展示
# 2. 或者使用 custom 链接指向你的赞助页面
# 3. 只需要取消注释并填入你的信息即可
